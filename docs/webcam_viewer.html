<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Webcam DB Viewer (Streaming)</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0a0e14; color: #c9d1d9; font-size: 13px; }
#toolbar {
  position: sticky; top: 0; z-index: 100;
  background: linear-gradient(to bottom, #161b22, #0d1117);
  border-bottom: 1px solid #30363d;
  padding: 12px 16px;
  display: flex; flex-wrap: wrap; gap: 12px; align-items: center;
}
#toolbar h1 { font-size: 16px; color: #4ade80; margin-right: 12px; }
#toolbar input, #toolbar select, #toolbar button {
  background: #0d1117; border: 1px solid #30363d; color: #c9d1d9;
  padding: 6px 10px; border-radius: 4px; font-size: 13px;
}
#toolbar input { min-width: 280px; }
#toolbar button { cursor: pointer; background: #21262d; }
#toolbar button:hover { background: #30363d; }
#stats { margin-left: auto; font-size: 12px; color: #8b949e; }
#tablewrap { overflow-y: auto; height: calc(100vh - 70px); }
table { border-collapse: collapse; width: 100%; table-layout: fixed; }
th {
  position: sticky; top: 0; background: #161b22; color: #4ade80;
  border-bottom: 1px solid #30363d; padding: 8px 10px;
  text-align: left; font-weight: 600; font-size: 12px;
  z-index: 10;
  
}
th.col-idx { width: 60px; }
th.col-cam { width: 280px; }
th.col-loc { width: 220px; }
th.col-feed { width: 320px; }
th.col-status { width: 90px; }
th.col-type { width: 140px; }
th.col-source { width: 100px; }
th.col-actions { width: 110px; }
td {
  padding: 6px 10px; border-bottom: 1px solid #21262d;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  vertical-align: middle;
}
tr:hover { background: #161b22; }
.row-private { background: rgba(248,81,73,0.04); }
.row-private:hover { background: rgba(248,81,73,0.08); }
.url { color: #58a6ff; font-family: 'JetBrains Mono', Consolas, monospace; font-size: 11px; cursor: pointer; }
.url:hover { text-decoration: underline; }
.country { color: #d2a8ff; }
.private-tag { color: #f85149; font-size: 10px; padding: 1px 5px; border: 1px solid #f85149; border-radius: 3px; margin-left: 6px; }
.live-tag { color: #4ade80; font-size: 10px; padding: 1px 5px; border: 1px solid #4ade80; border-radius: 3px; }
.dead-tag { color: #f85149; font-size: 10px; padding: 1px 5px; border: 1px solid #f85149; border-radius: 3px; }
.video-icon { color: #4ade80; }
.image-icon { color: #d2a8ff; }
.empty { padding: 40px; text-align: center; color: #8b949e; }
#loading { padding: 12px; text-align: center; color: #4ade80; font-family: monospace; }
#preview {
  position: fixed; right: 20px; bottom: 20px; width: 480px; height: 320px;
  background: #000; border: 1px solid #30363d; border-radius: 8px;
  display: none; z-index: 200; box-shadow: 0 8px 24px rgba(0,0,0,0.6);
}
#preview.open { display: block; }
#preview .close {
  position: absolute; top: 6px; right: 6px; z-index: 10;
  background: rgba(0,0,0,0.6); color: white; border: none; border-radius: 4px;
  padding: 4px 8px; cursor: pointer; font-size: 12px;
}
#preview .info {
  position: absolute; bottom: 6px; left: 6px; right: 6px;
  background: rgba(0,0,0,0.7); color: white; padding: 6px 10px; border-radius: 4px;
  font-size: 11px; font-family: monospace; word-break: break-all;
}
#preview img, #preview video { width: 100%; height: 100%; object-fit: contain; background: #000; }
.sort-arrow { font-size: 10px; margin-left: 4px; opacity: 0.5; }
.sort-arrow.active { opacity: 1; color: #4ade80; }
.tag-mp4 { background: #1f6feb22; color: #58a6ff; border: 1px solid #1f6feb; padding: 1px 6px; border-radius: 3px; font-size: 10px; }
.tag-m3u8 { background: #d2a8ff22; color: #d2a8ff; border: 1px solid #d2a8ff; padding: 1px 6px; border-radius: 3px; font-size: 10px; }
.tag-mjpg { background: #4ade8022; color: #4ade80; border: 1px solid #4ade80; padding: 1px 6px; border-radius: 3px; font-size: 10px; }
.tag-jpg { background: #8b949e22; color: #8b949e; border: 1px solid #8b949e; padding: 1px 6px; border-radius: 3px; font-size: 10px; }
</style>
</head>
<body>
<div id="toolbar">
  <h1>🎥 Webcam DB</h1>
  <input type="search" id="search" placeholder="Search URL, host, country, city..." autofocus>
  <select id="filterCountry">
    <option value="">All countries</option>
  </select>
  <select id="filterType">
    <option value="">All types</option>
    <option value="video">Video (mp4)</option>
    <option value="video-hls">Video (HLS m3u8)</option>
    <option value="video-mjpeg">Video (MJPEG)</option>
    <option value="image">Image (jpg)</option>
  </select>
  <select id="filterStatus">
    <option value="">All</option>
    <option value="live">Live</option>
    <option value="private">Private/Residential</option>
  </select>
  <select id="filterSource">
    <option value="">All sources</option>
    <option value="argus">Argus</option>
    <option value="opencctv">OpenCCTV</option>
    <option value="caltrans">Caltrans</option>
    <option value="tfl">TfL London</option>
    <option value="netlas">Netlas</option>
    <option value="insecam">Insecam</option>
  </select>
  <button id="sortIdx">Sort: idx</button>
  <button id="sortCountry">Sort: country</button>
  <button id="refreshBtn">Reload CSV</button>
  <span id="stats"></span>
</div>
<div id="loading">Loading CSV…</div>
<div id="tablewrap" style="display:none">
<table>
<thead>
<tr>
  <th class="col-idx">idx</th>
  <th class="col-cam">camera</th>
  <th class="col-loc">location</th>
  <th class="col-feed">live stream URL</th>
  <th class="col-status">status</th>
  <th class="col-type">type / format</th>
  <th class="col-source">source</th>
  <th class="col-actions">actions</th>
</tr>
</thead>
<tbody id="tbody"></tbody>
</table>
</div>

<div id="preview">
  <button class="close" onclick="closePreview()">Close</button>
  <div id="previewContent"></div>
  <div class="info" id="previewInfo"></div>
</div>

<script>
// Streaming CSV parser
class StreamingCSV {
  constructor(text) {
    this.text = text;
    this.pos = 0;
    this.rows = [];
    this.headers = null;
  }
  parse() {
    const text = this.text;
    const len = text.length;
    let row = [];
    let field = '';
    let inQuotes = false;
    while (this.pos < len) {
      const c = text[this.pos];
      if (inQuotes) {
        if (c === '"') {
          if (text[this.pos+1] === '"') {
            field += '"';
            this.pos += 2;
            continue;
          }
          inQuotes = false;
          this.pos++;
          continue;
        }
        field += c;
        this.pos++;
      } else {
        if (c === '"') {
          inQuotes = true;
          this.pos++;
        } else if (c === ',') {
          row.push(field);
          field = '';
          this.pos++;
        } else if (c === '\n' || c === '\r') {
          if (field !== '' || row.length) {
            row.push(field);
            this.rows.push(row);
            row = [];
            field = '';
          }
          if (c === '\r' && text[this.pos+1] === '\n') this.pos++;
          this.pos++;
          if (!this.headers && this.rows.length > 0) {
            this.headers = this.rows.shift();
          }
        } else {
          field += c;
          this.pos++;
        }
      }
    }
    if (field !== '' || row.length) {
      row.push(field);
      this.rows.push(row);
    }
    return { headers: this.headers, rows: this.rows };
  }
}

const COL_IDX = 0;
const COL_PROJ = 1;
const COL_URL = 2;
const COL_LIVE_URL = 3;
const COL_TYPE = 4;
const COL_AUTH_REQ = 5;
const COL_AUTH_USER = 6;
const COL_AUTH_PASS = 7;
const COL_ENABLED = 8;
const COL_LIVE_STATUS = 9;
const COL_COUNTRY = 19;
const COL_CITY = 21;
const COL_LAT = 24;
const COL_LON = 25;
const COL_ORG = 28;
const COL_BRAND = 17;
const COL_CATEGORY = 15;
const COL_HOST = 31;
const COL_NOTES = 33;

let allRows = [];
let filteredRows = [];
let sortField = 'idx';
let sortDir = 'asc';

async function loadCSV() {
  document.getElementById('loading').style.display = 'block';
  document.getElementById('loading').textContent = 'Fetching CSV…';
  const res = await fetch('controllable_Webcams.csv', { cache: 'no-store' });
  if (!res.ok) {
    document.getElementById('loading').textContent = 'Failed to load CSV: ' + res.status;
    return;
  }
  document.getElementById('loading').textContent = 'Reading ' + (res.headers.get('content-length') || '?') + ' bytes…';
  const text = await res.text();
  document.getElementById('loading').textContent = 'Parsing ' + text.length + ' chars…';
  await new Promise(r => setTimeout(r, 10));
  const parser = new StreamingCSV(text);
  const result = parser.parse();
  allRows = result.rows;
  document.getElementById('loading').textContent = 'Indexed ' + allRows.length + ' rows. Rendering…';
  populateFilters();
  applyFilter();
}

function populateFilters() {
  const countries = new Set();
  for (const r of allRows) {
    const c = r[COL_COUNTRY];
    if (c && c.length < 50) countries.add(c);
  }
  const sel = document.getElementById('filterCountry');
  Array.from(countries).sort().forEach(c => {
    const opt = document.createElement('option');
    opt.value = c;
    opt.textContent = c;
    sel.appendChild(opt);
  });
}

function applyFilter() {
  renderCancelled = true;
  const q = document.getElementById('search').value.toLowerCase();
  const fCountry = document.getElementById('filterCountry').value;
  const fType = document.getElementById('filterType').value;
  const fStatus = document.getElementById('filterStatus').value;
  const fSource = document.getElementById('filterSource').value;

  filteredRows = allRows.filter(r => {
    if (fCountry && r[COL_COUNTRY] !== fCountry) return false;
    if (fType && !checkType(r[COL_TYPE], fType)) return false;
    if (fStatus === 'live' && r[COL_LIVE_STATUS] !== 'live') return false;
    if (fStatus === 'private' && r[COL_CATEGORY] !== 'private') return false;
    if (fSource && !(r[COL_NOTES] || '').includes(fSource + '_id=')) return false;
    if (q) {
      const blob = (r[COL_URL] + ' ' + r[COL_LIVE_URL] + ' ' + r[COL_HOST] + ' ' + r[COL_COUNTRY] + ' ' + r[COL_CITY] + ' ' + r[COL_ORG] + ' ' + r[COL_PROJ] + ' ' + r[COL_BRAND]).toLowerCase();
      if (!blob.includes(q)) return false;
    }
    return true;
  });

  sortRows();
  render();
}

function checkType(type, filter) {
  if (!type) return false;
  const t = type.toLowerCase();
  if (filter === 'video' && t.includes('video')) return true;
  if (filter === 'video-hls' && (t.includes('hls') || t.includes('m3u8'))) return true;
  if (filter === 'video-mjpeg' && t.includes('mjpeg')) return true;
  if (filter === 'image' && t.includes('image')) return true;
  return false;
}

function sortRows() {
  const dir = sortDir === 'asc' ? 1 : -1;
  filteredRows.sort((a, b) => {
    let av, bv;
    if (sortField === 'idx') {
      av = parseInt(a[COL_IDX]) || 0;
      bv = parseInt(b[COL_IDX]) || 0;
    } else if (sortField === 'country') {
      av = (a[COL_COUNTRY] || '').toLowerCase();
      bv = (b[COL_COUNTRY] || '').toLowerCase();
    }
    if (av < bv) return -1 * dir;
    if (av > bv) return 1 * dir;
    return 0;
  });
}

function formatBadge(type) {
  if (!type) return '';
  const t = type.toLowerCase();
  if (t.includes('hls') || t.includes('m3u8')) return '<span class="tag-m3u8">HLS</span>';
  if (t.includes('mp4')) return '<span class="tag-mp4">MP4</span>';
  if (t.includes('mjpeg')) return '<span class="tag-mjpg">MJPEG</span>';
  if (t.includes('image')) return '<span class="tag-jpg">JPG</span>';
  return '<span class="tag-jpg">' + type + '</span>';
}

function formatSource(notes) {
  if (!notes) return '';
  const m = notes.match(/(\w+)_id=/);
  if (m) return '<span style="color:#8b949e;font-size:11px">' + m[1] + '</span>';
  return '';
}

function escapeHtml(s) {
  if (!s) return '';
  return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

const PAGE_SIZE = 500;
let renderCancelled = false;

function buildRow(r, includeAuth) {
  const tr = document.createElement('tr');
  if (r[COL_CATEGORY] === 'private') tr.classList.add('row-private');
  const authReq = r[COL_AUTH_REQ] === 'True';
  const liveUrl = r[COL_LIVE_URL] || '';
  const liveTag = r[COL_LIVE_STATUS] === 'live' ? '<span class="live-tag">LIVE</span>' : '<span class="dead-tag">DEAD</span>';
  const sourceMatch = (r[COL_NOTES] || '').match(/(\w+)_id=/);
  const source = sourceMatch ? sourceMatch[1] : '';
  const cityState = [r[COL_CITY], r[COL_COUNTRY]].filter(x => x).join(', ');
  const authU = includeAuth ? escapeHtml(r[COL_AUTH_USER] || '') : '';
  const authP = includeAuth ? escapeHtml(r[COL_AUTH_PASS] || '') : '';
  tr.innerHTML = `
    <td class="col-idx">${r[COL_IDX]}</td>
    <td class="col-cam">
      <strong>${escapeHtml(r[COL_PROJ] || r[COL_HOST] || '')}</strong>
      ${r[COL_CATEGORY] === 'private' ? '<span class="private-tag">PRIVATE</span>' : ''}
      ${authReq ? '<span class="private-tag" title="Auth required">AUTH</span>' : ''}
      <br><span style="color:#8b949e;font-size:11px">${escapeHtml(r[COL_ORG] || '')}</span>
    </td>
    <td class="col-loc">
      <span class="country">${escapeHtml(cityState)}</span><br>
      <span style="color:#8b949e;font-size:11px">${escapeHtml(r[COL_BRAND] || '')} · ${(parseFloat(r[COL_LAT]) || 0).toFixed(3)},${(parseFloat(r[COL_LON]) || 0).toFixed(3)}</span>
    </td>
    <td class="col-feed">
      <a class="url" onclick="previewCam('${encodeURIComponent(liveUrl)}','${encodeURIComponent(r[COL_PROJ] || '')}','${escapeHtml(r[COL_HOST] || '')}', '${authU}', '${authP}')">${escapeHtml(liveUrl.substring(0, 80))}${liveUrl.length > 80 ? '…' : ''}</a>
    </td>
    <td class="col-status">${liveTag}</td>
    <td class="col-type">${formatBadge(r[COL_TYPE])}</td>
    <td class="col-source"><span style="color:#8b949e;font-size:11px">${escapeHtml(source)}</span></td>
    <td class="col-actions">
      <button onclick="openInVLC('${encodeURIComponent(liveUrl)}', '${authU}', '${authP}')" title="Open in VLC">▶ VLC</button>
      <button onclick="openDirect('${encodeURIComponent(liveUrl)}')" title="Open in new tab">↗</button>
    </td>
  `;
  return tr;
}

function render() {
  renderCancelled = false;
  const tbody = document.getElementById('tbody');
  tbody.innerHTML = '';
  const total = filteredRows.length;
  const counter = document.createElement('div');
  counter.id = 'renderProgress';
  counter.style.cssText = 'position:fixed;bottom:10px;right:10px;background:#1a1a1a;border:1px solid #444;padding:6px 12px;border-radius:4px;color:#8b949e;font-size:11px;z-index:9999;';
  counter.textContent = 'Rendering 0 / ' + total;
  document.body.appendChild(counter);
  let offset = 0;
  const totalAll = allRows.length;
  document.getElementById('stats').textContent = total + ' / ' + totalAll + ' cams';
  document.getElementById('loading').style.display = 'none';
  document.getElementById('tablewrap').style.display = 'block';
  function renderChunk() {
    if (renderCancelled) return;
    const frag = document.createDocumentFragment();
    const end = Math.min(offset + PAGE_SIZE, total);
    for (let i = offset; i < end; i++) {
      frag.appendChild(buildRow(filteredRows[i], true));
    }
    tbody.appendChild(frag);
    offset = end;
    counter.textContent = 'Rendering ' + offset + ' / ' + total;
    if (offset < total) {
      (window.requestIdleCallback || ((cb) => setTimeout(cb, 0)))(renderChunk);
    } else {
      counter.remove();
    }
  }
  renderChunk();
}

function previewCam(urlEncoded, nameEncoded, host, authUser, authPass) {
  const url = decodeURIComponent(urlEncoded);
  const name = decodeURIComponent(nameEncoded);
  document.getElementById('preview').classList.add('open');
  const info = document.getElementById('previewInfo');
  info.textContent = name + ' — ' + url;
  const content = document.getElementById('previewContent');
  content.innerHTML = '';
  const lowerUrl = url.toLowerCase();
  if (lowerUrl.includes('.m3u8') && window.Hls) {
    const video = document.createElement('video');
    video.controls = true;
    video.autoplay = true;
    video.muted = true;
    content.appendChild(video);
    const hls = new Hls();
    hls.loadSource(url);
    hls.attachMedia(video);
  } else if (lowerUrl.includes('.mp4')) {
    const video = document.createElement('video');
    video.src = url;
    video.controls = true;
    video.autoplay = true;
    video.muted = true;
    content.appendChild(video);
  } else if (lowerUrl.includes('/mjpeg/') || lowerUrl.includes('multipart/x-mixed-replace')) {
    // MJPEG live stream (multipart/x-mixed-replace)
    const img = document.createElement('img');
    img.src = url + (url.includes('?') ? '&' : '?') + 't=' + Date.now();
    img.style.maxWidth = '100%';
    img.style.maxHeight = '70vh';
    img.alt = 'MJPEG Live Stream';
    const loading = document.createElement('div');
    loading.textContent = 'Loading MJPEG stream... (browser may take a few seconds)';
    loading.style.cssText = 'color:#8b949e;font-size:12px;padding:8px;text-align:center;';
    content.appendChild(loading);
    content.appendChild(img);
    img.onload = () => loading.style.display = 'none';
    img.onerror = () => {
      loading.textContent = 'Stream failed. Click Open Direct to view in new tab.';
    };
  } else {
    const img = document.createElement('img');
    img.src = url + (url.includes('?') ? '&' : '?') + 't=' + Date.now();
    content.appendChild(img);
  }
}

function closePreview() {
  document.getElementById('preview').classList.remove('open');
  document.getElementById('previewContent').innerHTML = '';
}

function openInVLC(urlEncoded, authUser, authPass) {
  const url = decodeURIComponent(urlEncoded);
  const user = authUser || '';
  const pass = authPass || '';
  let auth = '';
  if (user && pass) {
    const encUser = encodeURIComponent(user);
    const encPass = encodeURIComponent(pass);
    if (url.startsWith('rtsp://')) {
      auth = `${encUser}:${encPass}@`;
      url = url.replace('rtsp://', 'rtsp://' + auth);
    } else {
      // For HTTP, use URL-encoded creds
      const u = new URL(url);
      u.username = user;
      u.password = pass;
      url = u.toString();
    }
  }
  // Try VLC web interface first; fall back to copying to clipboard
  navigator.clipboard.writeText(url).then(() => {
    alert('URL copied to clipboard. Paste into VLC:\n' + url);
  });
}

function openDirect(urlEncoded) {
  const url = decodeURIComponent(urlEncoded);
  window.open(url, '_blank');
}

document.getElementById('search').addEventListener('input', debounce(applyFilter, 200));
document.getElementById('filterCountry').addEventListener('change', applyFilter);
document.getElementById('filterType').addEventListener('change', applyFilter);
document.getElementById('filterStatus').addEventListener('change', applyFilter);
document.getElementById('filterSource').addEventListener('change', applyFilter);
document.getElementById('sortIdx').addEventListener('click', () => { sortField='idx'; sortDir=sortDir==='asc'?'desc':'asc'; applyFilter(); });
document.getElementById('sortCountry').addEventListener('click', () => { sortField='country'; sortDir=sortDir==='asc'?'desc':'asc'; applyFilter(); });
document.getElementById('refreshBtn').addEventListener('click', () => loadCSV());

function debounce(fn, ms) {
  let t;
  return (...args) => { clearTimeout(t); t = setTimeout(() => fn(...args), ms); };
}

// Load HLS.js from CDN
const hlsScript = document.createElement('script');
hlsScript.src = 'https://cdn.jsdelivr.net/npm/hls.js@1.7.1';
hlsScript.onload = () => console.log('hls.js loaded');
document.head.appendChild(hlsScript);

loadCSV();
</script>
</body>
</html>
