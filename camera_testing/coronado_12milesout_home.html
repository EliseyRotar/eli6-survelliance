<!DOCTYPE html>

<html>
<head>
    <meta name="viewport" content="width=device-width"/>
    <title>City of Coronado - Public Meeting Video Library</title>
    <meta name="author" content="City of Coronado"/>
    <link href="https://fonts.googleapis.com/css?family=Libre+Baskerville:700|Lato" rel="stylesheet" type="text/css">
    <link href="/static/style.css?v=mmuuQQMIG1mQA-Xk7RqbMTtl68UP_UQsJpAO58SDAiw" rel="stylesheet" />
    
    
<meta name="description" content="Coronado's Public Meeting Video Archive and Live Meeting Viewer"/>
<meta itemprop="name" content="City of Coronado's Video Archive">
<meta itemprop="description" content="Coronado's Public Meeting Video Archive and Live Meeting Viewer">
<meta itemprop="image" content="https://coronado.12milesout.com/social/city-seal.jpg">
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="City of Coronado's Video Archive">
<meta name="twitter:description" content="Coronado's Public Meeting Video Archive and Live Meeting Viewer">
<meta name="twitter:image" content="https://coronado.12milesout.com/social/city-seal.jpg">
<meta property="og:title" content="City of Coronado's Video Archive">
<meta property="og:description" content="Coronado's Public Meeting Video Archive and Live Meeting Viewer">
<meta property="og:type" content="website">
<meta property="og:image" content="https://coronado.12milesout.com/social/city-seal.jpg">
<meta property="og:site_name" content="City of Coronado's Video Archive">
<meta property="og:image:type" content="image/jpeg">


</head>
<body>

<div id="live-link-container">
    <div class="live-meeting-link">
        <a href="/livevideo"><i class="fa fa-video-camera" aria-hidden="true"></i> Coronado TV On The Air Now</a>
    </div>
</div>

<div class="container">
    


<div class="row">
    <div class="col-sm-12">
        <h2>Public Meeting Video Library</h2>
    </div>
</div>

<div id="meetingList" class="bordered" v-cloak>
    
    <div class="row">
        <div class="col-md-3">
            <meeting-type-picker></meeting-type-picker>
        </div>
        <div class="col-md-9">
            <form method="get" action="/search">
                <div class="form-group">
                    <label for="q"><i class="fa fa-search"></i> Search</label>
                    <input id="q" name="q" class="form-control" type="text" placeholder="Search Agenda Items" />
                </div>
            </form>
        </div>
    </div>

    <div class="row">
        <div class="col-md-12">

            <table class="table table-striped table-hover table-condensed">
                <thead>
                <tr>
                    <th>
                    </th>
                    <th>Meeting Type</th>
                    <th>Date</th>
                    <th class="hidden-xs">Length</th>
                </tr>
                </thead>
                <tbody>
                <tr v-for="item in items">
                    <td>
                        <a v-bind:href="item.url" class="btn btn-primary">View</a>
                    </td>
                    <td class="title">{{ item.title }}</td>
                    <td>{{ item.meetingDate }}</td>
                    <td class="hidden-xs">{{ item.duration }}</td>
                </tr>
                </tbody>
            </table>

        </div>
    </div>

    <div class="row">
        <div class="col-md-12 table-pagination">
            <ul class="pagination">
                <li v-for="n in pageList" 
                    v-bind:class="{'active': n.isActive}">
                    <a v-on:click="paginationClick(n)">
                        {{{ n.label }}}
                    </a>
                </li>
            </ul>
        </div>
    </div>

</div>



</div>

<footer class="footer">
    <div class="container">

        <div class="row">

            <div class="col-sm-10">
                <h3>City of Coronado</h3>

                <div class="address">
                    <p>Phone: (619) 522-7300</p>
                    <p>1825 Strand Way Coronado, CA 92118</p>
                </div>

            </div>

        </div>

    </div>
</footer>


    
<script src="/static/vendor.js?v=TtdT5Fad7O5XUHDs9XZynLlbGb-OUAFuuiAgL1p_QV8"></script>
<script src="/static/layout.js?v=ktzJ6LKWg1JoKB6XHw_3VFGXWL2SI6yZlsQcySL2h2k"></script>

    <script src="/static/pages_meeting_list.js?v=HDwdADDkANlihOYU4-E2yO1uBsz-qKQStiuQNDRkMwc"></script>

</body>
</html>
